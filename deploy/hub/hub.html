<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot hub</title>
<style>
:root {
  --bg: #f6f3ec; --card: #fffdf8; --ink: #2b2620; --muted: #7a7064; --line: #e4dccd;
  --accent: #8a5a1f; --accent-ink: #fff; --ok: #2f7d4f; --warn: #a3631a; --bad: #a33a2a; --chip: #efe7d8;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1b1916; --card: #24211d; --ink: #ece6dc; --muted: #a39a8c; --line: #3a352e;
          --accent: #d39a52; --accent-ink: #1b1916; --ok: #6cc08c; --warn: #e0a55a; --bad: #e07a68; --chip: #322e28; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--card); }
header h1 { font-size: 17px; margin: 0; }
.muted { color: var(--muted); }
main { max-width: 1400px; margin: 0 auto; padding: 16px 20px 40px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; color: inherit; text-decoration: none; }
a.card:hover { border-color: var(--accent); }
.top { display: flex; align-items: center; gap: 8px; }
.top b { font-size: 16px; }
.kind { font-size: 12px; color: var(--muted); }
.spacer { flex: 1; }
.state { font-size: 12px; border-radius: 999px; padding: 2px 10px; background: var(--chip); }
.state.up { color: var(--ok); }
.state.down { color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.chip.on { color: var(--ok); }
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.num b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.num span { font-size: 12px; color: var(--muted); }
.num.turn b { color: var(--ok); }
.meta { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.last { font: 12px/1.5 ui-monospace, Consolas, monospace; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.err { color: var(--bad); font-size: 13px; overflow-wrap: anywhere; }
@media (max-width: 600px) { header, main { padding-left: 16px; padding-right: 16px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Bot hub</h1>
  <span class="muted" id="stamp"></span>
</header>
<main>
  <div class="grid" id="grid"></div>
</main>
<script>
const TOKEN = "__HUB_TOKEN__";
const BOTS = __HUB_BOTS__;
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const chip = (on, text) => `<span class="chip ${on ? "on" : ""}">${esc(text)} ${on ? "on" : "off"}</span>`;

function card(b) {
  if (!b) return "";
  const head = `<div class="top"><b>${esc(b.label)}</b><span class="kind">${esc(b.kind)}</span><span class="spacer"></span>
    <span class="state ${b.online ? "up" : b.online === false ? "down" : ""}">${b.online ? "online" : b.online === false ? "offline" : "…"}</span></div>`;
  if (!b.online) {
    return `<a class="card" href="/bot/${esc(b.id)}/">${head}${b.error ? `<div class="err">${esc(b.error)}</div>` : ""}</a>`;
  }
  return `<a class="card" href="/bot/${esc(b.id)}/">${head}
    <div class="meta">${esc(b.account || "–")} · ${esc(b.server || "")} · engine ${esc(b.engine || "–")}</div>
    <div class="meta">${esc(b.agent || "")}</div>
    <div class="chips">${chip(b.join, "join")}${chip(b.host, "host")}${chip(b.match, "matchmaking")}${b.queued ? '<span class="chip on">in queue</span>' : ""}</div>
    <div class="nums">
      <div class="num"><b>${b.live}</b><span>live games</span></div>
      <div class="num"><b>${b.rundenspiele}</b><span>Rundenspiele</span></div>
      <div class="num ${b.yourTurn ? "turn" : ""}"><b>${b.yourTurn}</b><span>its turn</span></div>
    </div>
    ${b.note ? `<div class="err">${esc(b.note)}</div>` : ""}
    <div class="last" title="${esc(b.last)}">${esc(b.last)}</div></a>`;
}

let rows = BOTS.map(b => ({ ...b, online: null }));
const render = () => { $("grid").innerHTML = rows.map(card).join(""); };

async function refresh() {
  try {
    const r = await fetch("/api/overview", { headers: { "X-Panel-Token": TOKEN } });
    if (!r.ok) throw new Error(r.status);
    rows = (await r.json()).bots;
    $("stamp").textContent = "updated " + new Date().toLocaleTimeString();
  } catch (e) {
    $("stamp").textContent = "hub not reachable (" + e.message + ")";
  }
  render();
}
render();
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
