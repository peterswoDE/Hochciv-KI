# All online bots plus one control page (hub) on http://127.0.0.1:8700
#
#   cd deploy
#   docker compose up -d --build        # start / update everything
#   docker compose logs -f neurabot     # one bot's log
#   docker compose stop statibot        # stop one bot
#
# One folder per bot, everything of that bot in it; the folder name is the bot's id (= service
# name below):
#   bots/<id>/bot.json        label, panel port, kind (committed; the hub reads these)
#   bots/<id>/bot.env         HOCHCIV_URL, HOCHCIV_TOKEN (git-ignored)
#   bots/<id>/settings.json   what the bot writes (git-ignored)
# Each bot mounts only its own folder, as /data. The hub gets only the bot.json files, never a
# bot.env.
#
# The bots and the hub share the network namespace of the `net` container, so every bot panel
# stays on 127.0.0.1:<its port> (as without Docker) and only the hub is published, on the host's
# 127.0.0.1. A new bot: its folder, a service block below (port as in bot.json) and its bot.json
# line at the hub.

name: hochciv-bots

x-bot: &bot
  restart: unless-stopped
  network_mode: "service:net"
  depends_on: [net]
  init: true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-ki: &ki
  <<: *bot
  build:
    context: .
    dockerfile: ki.Dockerfile
    additional_contexts: { ki: "${KI_DIR:-..}" }
  image: hochciv-bots/ki
  deploy:
    resources:
      reservations:
        devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

x-hc: &hc
  <<: *bot
  build:
    context: .
    dockerfile: hcbots.Dockerfile
    additional_contexts: { hc: "${KI_DIR:-..}/hardcoded" }
  image: hochciv-bots/hcbots

# read-only for every bot: the server repo's engine copies (each engine version a game runs on)
x-engines: &engines "${SERVER_DIR:-../../multiplayer-server}:/multiplayer-server:ro"
x-checkpoints: &checkpoints "${KI_DIR:-..}/checkpoints:/app/checkpoints:ro"
# lost games of the KI bots, for train_ppo --loss-dir runs/online_positions
x-positions: &positions "${KI_DIR:-..}/runs/online_positions:/app/runs/online_positions"

services:
  net:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    init: true
    restart: unless-stopped
    ports: ["127.0.0.1:${HUB_PORT:-8700}:8700"]

  hub:
    <<: *bot
    image: python:3.13-slim-bookworm
    command: ["python", "-u", "/hub/hub.py"]
    environment:
      BOTS_DIR: /config/bots
      HUB_HOSTS: "127.0.0.1:${HUB_PORT:-8700},localhost:${HUB_PORT:-8700}"
    volumes:
      - ./hub:/hub:ro
      # only the bot.json of each bot (one line per bot), never its bot.env
      - ./bots/neurabot/bot.json:/config/bots/neurabot/bot.json:ro
      - ./bots/neuranew/bot.json:/config/bots/neuranew/bot.json:ro
      - ./bots/statibot/bot.json:/config/bots/statibot/bot.json:ro

  neurabot:
    <<: *ki
    command: [--config, /data/bot.env, --port, "8765",
              --agent, ckpt:checkpoints/ppo29/best.pt, --marathon-agent, ckpt:checkpoints/v6.pt,
              --settings, /data/settings.json, --positions, runs/online_positions]
    volumes: [*checkpoints, *positions, *engines, ./bots/neurabot:/data]

  neuranew:
    <<: *ki
    command: [--config, /data/bot.env, --port, "8766",
              --agent, ckpt:checkpoints/ppo29/best.pt, --marathon-agent, ckpt:checkpoints/v6.pt,
              --settings, /data/settings.json, --positions, runs/online_positions]
    volumes: [*checkpoints, *positions, *engines, ./bots/neuranew:/data]

  statibot:
    <<: *hc
    command: [--config, /data/bot.env, --port, "8780", --bot, rusher,
              --settings, /data/settings.json]
    volumes: [*engines, ./bots/statibot:/data]
